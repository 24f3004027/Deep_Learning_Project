name: Keep App Alive (Automatic Deploy)

on:
  schedule:
    # Runs every 3 days to force a minor redeploy and keep the app awake forever
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants the workflow permission to push empty commits

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Push Empty Keep-Alive Commit
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -m "Chore: automated keep-alive refresh [skip ci]"
          git push origin main
